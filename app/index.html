<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>FLYTOWN — a town of people with fly brains</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Boot-failure trap (inline so it exists before the module graph evaluates).
      window.__showFatal = function (msg) {
        var el = document.getElementById('fatal');
        if (!el) { el = document.createElement('pre'); el.id = 'fatal';
          el.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;max-height:40vh;overflow:auto;margin:0;padding:12px 14px;border-radius:12px;background:#2a1414;color:#ffd7d7;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap';
          (document.body || document.documentElement).appendChild(el); }
        el.textContent += (el.textContent ? '\n' : '') + msg;
      };
      window.addEventListener('error', function (e) { window.__showFatal('error: ' + e.message + ' (' + (e.filename || '') + ':' + e.lineno + ')'); }, true);
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; window.__showFatal('unhandled: ' + ((r && (r.stack || r.message)) || String(r))); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
